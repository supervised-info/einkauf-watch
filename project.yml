name: Einkauf
options:
  bundleIdPrefix: net.tschelle
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: de
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  CURRENT_PROJECT_VERSION: 51
  MARKETING_VERSION: "1.0"
  DEVELOPMENT_TEAM: WV26CSTDDR
targets:
  Einkauf:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
      - path: Fixtures/einkauf-backup.json
        buildPhase: resources
        optional: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf
      PRODUCT_NAME: Einkauf
      CODE_SIGN_ENTITLEMENTS: Sources/iOS/Einkauf.entitlements
      INFOPLIST_FILE: Sources/iOS/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: EinkaufWatch
        embed: true
      - target: EinkaufWidgets
        embed: true
        codeSign: true
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
    scheme:
      testTargets: []
  EinkaufWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf.watchkitapp
      PRODUCT_NAME: EinkaufWatch
      CODE_SIGN_ENTITLEMENTS: Sources/Watch/EinkaufWatch.entitlements
      INFOPLIST_FILE: Sources/Watch/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.tschelle.einkauf
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      TARGETED_DEVICE_FAMILY: "4"
      SKIP_INSTALL: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - target: EinkaufWatchWidgets
        embed: true
        codeSign: true
  EinkaufWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/WatchWidgets
      - path: Sources/Shared
        excludes:
          - ConnectivitySync.swift
          - ShoppingStore.swift
          - Theme.swift
          - ItemEditing.swift
          - ListShare.swift
          - BackupShare.swift
          - KeywordDictionaryBrowse.swift
          - StapleApply.swift
          - EinkaufAddItemsIntent.swift
          - SiriPendingAdds.swift
          - TodoStore.swift
          - TodoAddItemsIntent.swift
          - TodoSiriPendingAdds.swift
          - WatchSyncEnvelope.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf.watchkitapp.widgets
      PRODUCT_NAME: EinkaufWatchWidgets
      APPLICATION_EXTENSION_API_ONLY: YES
      CODE_SIGN_ENTITLEMENTS: Sources/WatchWidgets/EinkaufWatchWidgets.entitlements
      INFOPLIST_FILE: Sources/WatchWidgets/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      TARGETED_DEVICE_FAMILY: "4"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  EinkaufWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/iOSWidgets
      - path: Sources/Shared
        excludes:
          - ConnectivitySync.swift
          - ShoppingStore.swift
          - Theme.swift
          - ItemEditing.swift
          - ListShare.swift
          - BackupShare.swift
          - KeywordDictionaryBrowse.swift
          - StapleApply.swift
          - EinkaufAddItemsIntent.swift
          - SiriPendingAdds.swift
          - TodoStore.swift
          - TodoAddItemsIntent.swift
          - TodoSiriPendingAdds.swift
          - WatchSyncEnvelope.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf.widgets
      PRODUCT_NAME: EinkaufWidgets
      APPLICATION_EXTENSION_API_ONLY: YES
      CODE_SIGN_ENTITLEMENTS: Sources/iOSWidgets/EinkaufWidgets.entitlements
      INFOPLIST_FILE: Sources/iOSWidgets/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      TARGETED_DEVICE_FAMILY: "1"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  Einkauf:
    build:
      targets:
        Einkauf: all
        EinkaufWatch: all
        EinkaufWatchWidgets: all
        EinkaufWidgets: all
    run:
      config: Debug
      executable: Einkauf
