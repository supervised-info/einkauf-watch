name: Einkauf
options:
  bundleIdPrefix: net.tschelle
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: de
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  CURRENT_PROJECT_VERSION: 6
  MARKETING_VERSION: "1.0"
targets:
  Einkauf:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
      - path: Fixtures/einkauf-backup.json
        buildPhase: resources
        optional: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf
      PRODUCT_NAME: Einkauf
      INFOPLIST_FILE: Sources/iOS/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: EinkaufWatch
        embed: true
      - sdk: WatchConnectivity.framework
    scheme:
      testTargets: []
  EinkaufWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.tschelle.einkauf.watchkitapp
      PRODUCT_NAME: EinkaufWatch
      INFOPLIST_FILE: Sources/Watch/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Einkauf
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.tschelle.einkauf
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      TARGETED_DEVICE_FAMILY: "4"
      SKIP_INSTALL: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: WatchConnectivity.framework
schemes:
  Einkauf:
    build:
      targets:
        Einkauf: all
        EinkaufWatch: all
    run:
      config: Debug
      executable: Einkauf
